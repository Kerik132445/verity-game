<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Verity</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<div class="background">
		<div class="background-noise"></div>
	</div>

	<div class="game">

		<div class="phone">

			<div class="phone-screen">

				<div class="screen-cracks">
					<svg viewBox="0 0 430 850">
						<path d="M380 80 L330 150 L350 210 L290 280" />
						<path d="M330 150 L280 120 L250 80" />
						<path d="M350 210 L390 250 L370 320" />

						<path d="M60 700 L120 640 L100 580 L160 520" />
						<path d="M120 640 L180 680 L220 750" />
					</svg>
				</div>

				<div class="phone-camera"></div>

				<div class="chat">

					<div class="chat-header">

						<div class="avatar">
							<div class="avatar-glitch"></div>
							<img src="images/verity.png" alt="Верити">
						</div>

						<div class="chat-info">
							<div class="chat-name">Верити</div>
							<div class="chat-status">в сети</div>
						</div>

					</div>

					<div id="messages"></div>

					<div id="choiceButtons">

						<button class="choice-button" id="choice1"></button>

						<button class="choice-button" id="choice2"></button>

					</div>

				</div>

			</div>
		</div>

		<div class="right-panel">
			<div class="game-hud">


				<div class="relationship-stat">

					<img src="images/angry.png" class="relationship-icon" alt="Злость">

					<div class="relationship-line">
						<div id="relationshipPoint" class="relationship-point">
						</div>
					</div>

					<img src="images/love.png" class="relationship-icon" alt="Любовь">

				</div>

				<div class="lives-stat">

					<div id="livesContainer" class="lives-container">
						<img src="images/heart.png" class="minecraft-heart">
						<img src="images/heart.png" class="minecraft-heart">
						<img src="images/heart.png" class="minecraft-heart">
					</div>
				</div>

			</div>

			<div class="game-panel">

				<button id="inventoryButton" class="game-button" title="Инвентарь">
					<img src="images/chest.png" alt="Инвентарь">
					<span>ИНВЕНТАРЬ</span>
				</button>

				<button id="itemAdButton" class="game-button" title="Получить предмет">
					<img src="images/items.png" alt="Предмет">
					<span>ПОЛУЧИТЬ ПРЕДМЕТ</span>
				</button>

				<button id="skinButton" class="game-button" title="Скины Верити">
					<img src="images/skins.png" alt="Скины">
					<span>СКИНЫ</span>
				</button>

				<div id="inventoryModal" class="inventory-modal">

					<div class="inventory-window">

						<div class="inventory-header">

							<span>Инвентарь</span>

							<button id="closeInventory">×</button>

						</div>

						<div id="inventoryGrid" class="inventory-grid"></div>

						<div id="itemInfo" class="item-info">

							<div id="itemName" class="item-name"></div>

							<div id="itemRarity" class="item-rarity"></div>

							<div id="itemDescription" class="item-description"></div>

						</div>

					</div>
				</div>
			</div>
		</div>
	</div>

	<div id="itemNotification" class="item-notification">

		<div class="notification-title">
			Новый предмет!
		</div>

		<div id="notificationItem"></div>

	</div>

	<div class="screen-effects"></div>

	<script src="script.js"></script>

	<div id="verityScreamer">
		<img src="images/screamer-verity.png" alt="Верити">
	</div>

</body>

</html>
