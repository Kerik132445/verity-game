<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<div class="game">

		<!-- Мессенджер -->
		<div class="chat">

			<div class="chat-header">

				<div class="avatar">
					<img src="images/verity.png" alt="Верити">
				</div>

				<div class="chat-info">
					<div class="chat-name">Верити</div>
					<div class="chat-status">в сети</div>
				</div>

				<div class="messages-counter">
					сообщений осталось:
					<span id="messagesLeft">3</span>
				</div>

			</div>


			<div id="messages"></div>


			<div class="chat-input">

				<div id="normalInput">

					<input id="messageInput" type="text" placeholder="Напиши сообщение...">

					<button id="sendButton">➤</button>

				</div>

				<button id="adButton">
					Получить +3 сообщения
				</button>

			</div>

		</div>


		<!-- Игровая панель -->
		<div class="game-panel">

			<button id="inventoryButton" class="game-button" title="Инвентарь">
				🎒
			</button>

			<button id="itemAdButton" class="game-button" title="Получить предмет">
				🎁
			</button>

			<button id="skinButton" class="game-button" title="Скины Верити">
				🎭
			</button>

		</div>

	</div>


	<!-- Инвентарь -->
	<div id="inventoryModal" class="inventory-modal">

		<div class="inventory-window">

			<div class="inventory-header">

				<span>Инвентарь</span>

				<button id="closeInventory">×</button>

			</div>


			<div id="inventoryGrid" class="inventory-grid"></div>


			<div id="itemInfo" class="item-info">

				<div id="itemName" class="item-name"></div>

				<div id="itemDescription" class="item-description"></div>

			</div>

		</div>

	</div>


	<!-- Уведомление о новом предмете -->
	<div id="itemNotification" class="item-notification">

		<div class="notification-title">
			🎁 Новый предмет!
		</div>

		<div id="notificationItem"></div>

	</div>


	<script src="script.js"></script>

</body>

</html>
