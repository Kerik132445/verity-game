<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<div class="chat">
		<div class="chat-header">
			<div class="avatar">
				<img src="images/verity.png" alt="Верити">
			</div>

			<div class="chat-info">
				<div class="chat-name">Верити</div>
				<div class="chat-status">в сети</div>
			</div>

			<div class="messages-counter">
				сообщений осталось: <span id="messagesLeft">3</span>
			</div>
		</div>


		<div id="messages"></div>

		<div class="chat-input">
			<div id="normalInput">
				<input id="messageInput" type="text" placeholder="Напиши сообщение...">
				<button id="sendButton">➤</button>
			</div>

			<button id="adButton">Получить +3 сообщения</button>
		</div>

	</div>



	<script src="script.js"></script>
</body>

</html>
